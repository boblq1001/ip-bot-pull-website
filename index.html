<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Output</title>
</head>
<body>

    <h1>My JavaScript Output</h1>
    <!-- This element will hold the JavaScript result -->
    <p id="output"></p>

    <script>
        // Define your data or logic in JavaScript
        let message = "Hello, World! This text came from JavaScript.";

        // Display the output inside the HTML paragraph tag
        document.getElementById("output").innerHTML = message;
    </script>

</body>
</html>
