<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My IP Address Getter</title>
    <style>
        /* CSS styling for a clean, centered box */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .ip-box {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
            background-color: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-wrap: break-word;
        }
        .loading {
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Your Public IP Address</h1>
        <!-- This is where the IP will show up -->
        <div id="ip-display" class="ip-box loading">Loading...</div>
    </div>

    <script>
        // JavaScript to fetch the IP data
        async function getIPAddress() {
            const displayDiv = document.getElementById('ip-display');
            
            try {
                // Fetching JSON data from ipify API
                const response = await fetch('https://ipify.org');
                if (!response.ok) throw new Error('Network issue');
                
                const data = await response.json();
                
                // Display the IP and remove the loading styling
                displayDiv.innerText = data.ip;
                displayDiv.classList.remove('loading');
            } catch (error) {
                console.error('Error fetching IP:', error);
                displayDiv.innerText = 'Failed to load IP';
                displayDiv.style.color = '#dc3545'; // Change to red on error
            }
        }

        // Run the function when the page loads
        window.onload = getIPAddress;
    </script>

</body>
</html>
